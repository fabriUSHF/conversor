<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor MP3 a OGG & YouTube Downloader</title>
    <!-- Librería Lamejs para decodificar MP3 a PCM en el navegador -->
    <script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>
    <style>
        :root {
            --bg: #121212;
            --surface: #1e1e1e;
            --primary: #bb86fc;
            --secondary: #03dac6;
            --error: #cf6679;
            --text: #e0e0e0;
            --text-dim: #a0a0a0;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: var(--bg); color: var(--text); margin: 0; padding: 20px; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
        h1 { color: var(--primary); text-align: center; margin-bottom: 5px; }
        .subtitle { color: var(--text-dim); text-align: center; margin-bottom: 30px; font-size: 0.9rem; }
        .container { background: var(--surface); padding: 30px; border-radius: 16px; width: 100%; max-width: 600px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        
        /* Tabs */
        .tabs { display: flex; margin-bottom: 20px; background: var(--bg); border-radius: 8px; padding: 4px; }
        .tab { flex: 1; padding: 12px; text-align: center; cursor: pointer; border-radius: 6px; font-weight: bold; color: var(--text-dim); transition: 0.3s; border: none; background: none; }
        .tab.active { background: var(--primary); color: #000; }
        
        /* Sections */
        .section { display: none; flex-direction: column; gap: 15px; }
        .section.active { display: flex; }
        
        /* Inputs & Buttons */
        input[type="text"], input[type="url"] { width: 100%; padding: 12px; background: var(--bg); border: 1px solid #333; color: var(--text); border-radius: 8px; outline: none; }
        input:focus { border-color: var(--primary); }
        button, .btn { padding: 12px 20px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; width: 100%; }
        .btn-primary { background: var(--primary); color: #000; }
        .btn-primary:hover { opacity: 0.9; }
        .btn-download { background: var(--secondary); color: #000; text-decoration: none; display: none; text-align: center; margin-top: 10px; }
        
        /* Upload Area */
        .upload-area { border: 2px dashed #333; padding: 30px; text-align: center; border-radius: 12px; cursor: pointer; transition: 0.3s; }
        .upload-area:hover { border-color: var(--primary); background: rgba(187, 134, 252, 0.1); }
        .upload-icon { font-size: 3rem; margin-bottom: 10px; }
        #file-input { display: none; }
        
        /* Progress & Status */
        .status { padding: 12px; border-radius: 8px; text-align: center; font-size: 0.9rem; display: none; }
        .status-info { background: rgba(3, 218, 198, 0.1); color: var(--secondary); border: 1px solid var(--secondary); }
        .status-error { background: rgba(207, 102, 121, 0.1); color: var(--error); border: 1px solid var(--error); }
        .status-success { background: rgba(3, 218, 198, 0.1); color: var(--secondary); border: 1px solid var(--secondary); }
        
        .progress-container { width: 100%; height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; display: none; }
        .progress-bar { height: 100%; background: var(--primary); width: 0%; transition: width 0.1s linear; }
        
        audio { width: 100%; margin-top: 15px; }
        .loader { border: 3px solid #333; border-top: 3px solid var(--primary); border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; margin-right: 10px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<h1>Audio Converter Pro</h1>
<p class="subtitle">Conversión local 100% privada y descargas gratuitas</p>

<div class="container">
    <div class="tabs">
        <button class="tab active" onclick="switchTab('mp3')">MP3 a OGG (Local)</button>
        <button class="tab" onclick="switchTab('yt')">YouTube a OGG</button>
    </div>

    <!-- Sección MP3 -->
    <div id="mp3-section" class="section active">
        <div class="upload-area" id="upload-area">
            <div class="upload-icon">📁</div>
            <p>Arrastra tu MP3 aquí o haz clic para buscar</p>
            <input type="file" id="file-input" accept="audio/mpeg">
        </div>
        
        <div id="mp3-status" class="status"></div>
        <div class="progress-container" id="mp3-progress"><div class="progress-bar" id="mp3-bar"></div></div>
        
        <audio id="mp3-player" controls style="display:none;"></audio>
        <a id="mp3-download" class="btn btn-download" href="#">⬇️ Descargar OGG</a>
    </div>

    <!-- Sección YouTube -->
    <div id="yt-section" class="section">
        <input type="url" id="yt-url" placeholder="Pega el enlace del video de YouTube aquí...">
        <button class="btn btn-primary" id="yt-btn" onclick="processYouTube()">Obtener Audio OGG</button>
        
        <div id="yt-status" class="status"></div>
        <div class="progress-container" id="yt-progress"><div class="progress-bar" id="yt-bar"></div></div>
        
        <audio id="yt-player" controls style="display:none;"></audio>
        <a id="yt-download" class="btn btn-download" href="#">⬇️ Descargar OGG de YouTube</a>
    </div>
</div>

<script>
    // --- MANEJO DE PESTAÑAS ---
    function switchTab(tab) {
        document.querySelectorAll('.tab').forEach((t, i) => {
            t.classList.toggle('active', (tab === 'mp3' && i === 0) || (tab === 'yt' && i === 1));
        });
        document.getElementById('mp3-section').classList.toggle('active', tab === 'mp3');
        document.getElementById('yt-section').classList.toggle('active', tab === 'yt');
    }

    // --- UTILIDADES UI ---
    function showStatus(id, msg, type) {
        const el = document.getElementById(id);
        el.className = `status status-${type}`;
        el.innerHTML = msg;
        el.style.display = 'block';
    }
    function hideStatus(id) { document.getElementById(id).style.display = 'none'; }
    function setProgress(id, percent) {
        const container = document.getElementById(id);
        const bar = document.getElementById(id.replace('-progress', '-bar'));
        container.style.display = 'block';
        bar.style.width = `${percent}%`;
    }

    // =========================================================================================
    // LÓGICA MP3 A OGG (100% EN EL NAVEGADOR USANDO WEB AUDIO API Y MEDIA RECORDER)
    // =========================================================================================
    const uploadArea = document.getElementById('upload-area');
    const fileInput = document.getElementById('file-input');

    uploadArea.addEventListener('click', () => fileInput.click());
    uploadArea.addEventListener('dragover', e => { e.preventDefault(); uploadArea.style.borderColor = 'var(--primary)'; });
    uploadArea.addEventListener('dragleave', () => { uploadArea.style.borderColor = '#333'; });
    uploadArea.addEventListener('drop', e => {
        e.preventDefault();
        uploadArea.style.borderColor = '#333';
        if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', e => { if(e.target.files.length) handleFile(e.target.files[0]); });

    async function handleFile(file) {
        if (!file || !file.name.toLowerCase().endsWith('.mp3')) {
            showStatus('mp3-status', '❌ Por favor selecciona un archivo MP3 válido.', 'error');
            return;
        }

        showStatus('mp3-status', '⏳ Leyendo archivo MP3...', 'info');
        setProgress('mp3-progress', 10);
        document.getElementById('mp3-player').style.display = 'none';
        document.getElementById('mp3-download').style.display = 'none';

        try {
            // 1. Decodificar MP3 a Buffer de Audio usando Web Audio API
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const arrayBuffer = await file.arrayBuffer();
            const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
            
            showStatus('mp3-status', '⏳ Convirtiendo a OGG Vorbis... (Esto puede tardar unos segundos)', 'info');
            setProgress('mp3-progress', 30);

            // 2. Convertir AudioBuffer a formato OGG usando MediaRecorder
            const oggBlob = await convertAudioBufferToOgg(audioBuffer);
            
            setProgress('mp3-progress', 100);
            showStatus('mp3-status', '✅ ¡Conversión completada!', 'success');

            // 3. Crear reproductor y link de descarga
            const oggUrl = URL.createObjectURL(oggBlob);
            const player = document.getElementById('mp3-player');
            player.src = oggUrl;
            player.style.display = 'block';

            const downloadBtn = document.getElementById('mp3-download');
            downloadBtn.href = oggUrl;
            downloadBtn.download = file.name.replace(/\.mp3$/i, '.ogg');
            downloadBtn.style.display = 'block';

            audioContext.close();
        } catch (err) {
            console.error(err);
            showStatus('mp3-status', '❌ Error al convertir. El archivo puede estar corrupto o ser demasiado grande.', 'error');
        }
    }

    function convertAudioBufferToOgg(audioBuffer) {
        return new Promise((resolve, reject) => {
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const source = audioContext.createBufferSource();
                source.buffer = audioBuffer;

                const dest = audioContext.createMediaStreamDestination();
                source.connect(dest);

                // Configurar MediaRecorder para OGG Vorbis
                const mimeType = 'audio/ogg; codecs=vorbis';
                if (!MediaRecorder.isTypeSupported(mimeType)) {
                    reject(new Error('Tu navegador no soporta la codificación OGG Vorbis nativa. Prueba con Firefox o Chrome.'));
                    return;
                }

                const recorder = new MediaRecorder(dest.stream, { mimeType: mimeType, audioBitsPerSecond: 128000 });
                const chunks = [];

                recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
                recorder.onstop = () => {
                    resolve(new Blob(chunks, { type: mimeType }));
                    audioContext.close();
                };

                // Iniciar grabación y reproducción
                recorder.start();
                source.start(0);

                // Detener cuando el audio termine
                source.onended = () => {
                    recorder.stop();
                };
            } catch (e) {
                reject(e);
            }
        });
    }

    // =========================================================================================
    // LÓGICA YOUTUBE A OGG (USANDO COBALT.TOOLS - CÓDIGO ABIERTO, SIN ANUNCIOS, GRATIS)
    // =========================================================================================
    async function processYouTube() {
        const url = document.getElementById('yt-url').value;
        if (!url || (!url.includes('youtube.com') && !url.includes('youtu.be'))) {
            showStatus('yt-status', '❌ Introduce una URL válida de YouTube.', 'error');
            return;
        }

        const btn = document.getElementById('yt-btn');
        btn.disabled = true;
        btn.innerText = "Procesando...";
        showStatus('yt-status', '<div class="loader"></div> Conectando con el servidor...', 'info');
        setProgress('yt-progress', 20);
        document.getElementById('yt-player').style.display = 'none';
        document.getElementById('yt-download').style.display = 'none';

        try {
            // Usamos la API pública de Cobalt.tools. Es 100% gratuita, sin API keys y de código abierto.
            const apiUrl = 'https://api.cobalt.tools/api/json';
            const payload = {
                url: url,
                vCodec: "h264",
                vQuality: "720",
                aFormat: "ogg", // Forzamos audio OGG
                isAudioOnly: true,
                filenamePattern: "basic"
            };

            const response = await fetch(apiUrl, {
                method: 'POST',
                headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await response.json();
            setProgress('yt-progress', 70);

            if (data.status === 'error' || data.status === 'rate-limit') {
                throw new Error(data.text || 'Error del servidor al procesar el video.');
            }

            if (data.status === 'redirect' || data.status === 'stream') {
                showStatus('yt-status', '<div class="loader"></div> Descargando archivo OGG...', 'info');
                
                // Descargar el archivo OGG para crear un Blob local y permitir descarga/reproducción segura
                const audioRes = await fetch(data.url);
                const audioBlob = await audioRes.blob();
                const localUrl = URL.createObjectURL(audioBlob);

                setProgress('yt-progress', 100);
                showStatus('yt-status', '✅ ¡Audio OGG de YouTube listo!', 'success');

                const player = document.getElementById('yt-player');
                player.src = localUrl;
                player.style.display = 'block';

                const downloadBtn = document.getElementById('yt-download');
                downloadBtn.href = localUrl;
                downloadBtn.download = `youtube_audio_${Date.now()}.ogg`;
                downloadBtn.style.display = 'block';

            } else if (data.status === 'picker') {
                throw new Error('Este es un enlace a una lista, no a un video individual.');
            } else {
                throw new Error('Respuesta inesperada del servidor.');
            }

        } catch (err) {
            console.error(err);
            showStatus('yt-status', `❌ ${err.message || 'Ocurrió un error de red. Verifica el enlace e intenta de nuevo.'}`, 'error');
        } finally {
            btn.disabled = false;
            btn.innerText = "Obtener Audio OGG";
        }
    }
</script>
</body>
</html>
